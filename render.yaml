services:
  - type: web
    name: edu-platform-api
    env: node
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run prisma:migrate:deploy && npm run prisma:seed:if-empty && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: edu-platform-db
          property: connectionString
      - key: JUDGE0_BASE_URL
        value: https://judge0-ce.p.rapidapi.com
      - key: JUDGE0_API_KEY
        sync: false
      - key: EXEC_TIMEOUT_MS
        value: 12000
      - key: EXEC_MAX_SOURCE_KB
        value: 64
      - key: EXEC_MAX_STDIN_KB
        value: 8
      - key: EXEC_MAX_OUTPUT_KB
        value: 32
  - type: web
    name: edu-platform-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: credentialless
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

dbs:
  - name: edu-platform-db
    databaseName: edu_platform
    user: edu_platform_user
