services:
  - type: web
    name: edu-platform-api
    env: node
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run prisma:migrate:deploy && npm run prisma:seed:if-empty && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: edu-platform-db
          property: connectionString
  - type: web
    name: edu-platform-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

dbs:
  - name: edu-platform-db
    databaseName: edu_platform
    user: edu_platform_user
